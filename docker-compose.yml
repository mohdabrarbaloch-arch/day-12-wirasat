services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wirasat
      POSTGRES_PASSWORD: wirasat
      POSTGRES_DB: wirasat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirasat"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://wirasat:wirasat@db:5432/wirasat
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_LOGIN: 10/minute
      RATE_LIMIT_GENERAL: 120/minute
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
